  <style>
    :root { --felt: #1d5c3f; --felt-dark: #154631; --ink: #f3f1e8; --muted: #b9cbbf; --accent: #f2c14e; --loss: #ff7a7a; }

    form { width: 100%; max-width: 340px; display: grid; gap: 12px; }
    h1 { font-size: 1.4rem; margin: 0; }
    p { margin: 0; color: var(--muted); }
    input, button { font: inherit; padding: 10px 12px; border-radius: 8px; border: 1px solid rgba(255, 255, 255, 0.35); }
    input { background: rgba(0, 0, 0, 0.2); color: var(--ink); }
    button { background: var(--accent); border-color: var(--accent); color: #2b2205; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: 0.6; cursor: wait; }
    #msg { min-height: 1.4em; color: var(--loss); font-weight: 600; }
  </style>

    const KEY_STORE = "cp-site-key:" + PAYLOAD.salt;   // per build, for this tab only
    const bytes = (b64) => Uint8Array.from(atob(b64), (c) => c.charCodeAt(0));
    const $ = (id) => document.getElementById(id);

    async function deriveKey(password) {
      const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]);
      return crypto.subtle.deriveKey(
        { name: "PBKDF2", hash: "SHA-256", salt: bytes(PAYLOAD.salt), iterations: PAYLOAD.iterations },
        base, { name: "AES-GCM", length: 256 }, true, ["decrypt"]);
    }

    // Throws if the key is wrong (AES-GCM checks integrity), so a bad password never shows garbage.
    async function show(key) {
      const zipped = await crypto.subtle.decrypt({ name: "AES-GCM", iv: bytes(PAYLOAD.iv) }, key, bytes(PAYLOAD.data));
      const html = await new Response(new Blob([zipped]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
      document.open();
      document.write(html);
      document.close();
    }

    async function remembered() {
      try {
        const raw = sessionStorage.getItem(KEY_STORE);
        if (!raw) return false;
        await show(await crypto.subtle.importKey("raw", bytes(raw), "AES-GCM", false, ["decrypt"]));
        return true;
      } catch (e) {
        try { sessionStorage.removeItem(KEY_STORE); } catch (e2) { /* storage unavailable */ }
        return false;
      }
    }

    if (!window.crypto || !crypto.subtle || !window.DecompressionStream) {
      $("msg").textContent = "This browser can't unlock the site. Open it over HTTPS in an up-to-date browser.";
      $("go").disabled = true;
    } else {
      remembered();
    }

    $("unlock").addEventListener("submit", async (e) => {
      e.preventDefault();
      $("go").disabled = true;
      $("msg").textContent = "";
      try {
        const key = await deriveKey($("password").value);
        const raw = new Uint8Array(await crypto.subtle.exportKey("raw", key));
        await show(key);
        try { sessionStorage.setItem(KEY_STORE, btoa(String.fromCharCode(...raw))); } catch (e2) { /* storage unavailable */ }
      } catch (err) {
        $("msg").textContent = "Wrong password.";
        $("go").disabled = false;
        $("password").select();
      }
    });
  })();
